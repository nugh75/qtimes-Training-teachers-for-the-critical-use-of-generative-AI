<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wiki Graph</title>
  <style>
    :root {
      --bg: #f4f8fb;
      --panel: #ffffff;
      --ink: #152235;
      --muted: #4b5b6f;
      --border: #d8e2ee;
      --shadow: 0 12px 30px rgba(21, 34, 53, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 20% 20%, #ebf5ff 0%, var(--bg) 45%, #eef8f4 100%);
    }
    .page {
      max-width: 1460px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 14px;
    }
    .head h1 {
      margin: 0;
      font-size: 1.5rem;
    }
    .head p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 300px) minmax(180px, 260px) minmax(170px, 220px) auto;
      gap: 10px;
      align-items: end;
    }
    .controls label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.84rem;
      color: var(--muted);
      font-weight: 600;
    }
    .controls input,
    .controls select,
    .controls button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
    }
    .btns button {
      width: auto;
      min-width: 44px;
      cursor: pointer;
      font-weight: 700;
      background: #f7fbff;
    }
    .meta-chip {
      justify-self: end;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 0.82rem;
      color: var(--muted);
      background: #f7fbff;
      white-space: nowrap;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      padding: 4px 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .sw {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.14);
      flex: 0 0 auto;
    }
    .graph-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(180deg, #fcfdff 0%, #f2f8ff 100%);
      overflow: hidden;
      min-height: 720px;
    }
    .graph-box svg {
      width: 100%;
      height: 720px;
      display: block;
      user-select: none;
      touch-action: none;
      cursor: grab;
    }
    .graph-box svg.dragging {
      cursor: grabbing;
    }
    .edge {
      stroke: #9db1c8;
      stroke-opacity: 0.34;
      stroke-linecap: round;
    }
    .node {
      stroke: rgba(15, 31, 48, 0.22);
      stroke-width: 1;
    }
    .node-label {
      font-size: 11px;
      font-weight: 600;
      fill: #203347;
      paint-order: stroke;
      stroke: #ffffff;
      stroke-width: 3px;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .note {
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.45;
    }
    @media (max-width: 1080px) {
      .controls {
        grid-template-columns: 1fr;
      }
      .btns {
        justify-content: flex-start;
      }
      .meta-chip {
        justify-self: start;
      }
      .graph-box svg {
        height: 640px;
      }
      .graph-box {
        min-height: 640px;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
