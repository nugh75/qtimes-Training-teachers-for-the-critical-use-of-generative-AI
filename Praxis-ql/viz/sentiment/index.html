<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PRAXIS Sentiment + Emozioni Dashboard</title>
  <style>
    :root {
      --bg: #f3f8f6;
      --panel: #ffffff;
      --ink: #18323f;
      --muted: #4d6673;
      --border: #d4e2e0;
      --pos: #1f7a48;
      --neu: #4b5f76;
      --neg: #b63a3a;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 15%, #e5f7f0 0%, transparent 35%),
        radial-gradient(circle at 90% 20%, #e8f1ff 0%, transparent 30%),
        var(--bg);
    }
    .page {
      max-width: 1240px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      gap: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 12px 28px rgba(9, 45, 62, 0.08);
    }
    h1 { margin: 0 0 6px; font-size: 1.5rem; }
    h2 { margin: 0 0 10px; font-size: 1.05rem; }
    p { margin: 6px 0; color: var(--muted); }
    .nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 0.92rem;
    }
    .nav a { color: #2273d6; text-decoration: none; font-weight: 600; }
    .nav a:hover { text-decoration: underline; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; }
    .kpi {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fbfefe;
    }
    .kpi .n { font-size: 1.28rem; font-weight: 700; line-height: 1.1; }
    .kpi .l { font-size: 0.78rem; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
    .kpi.pos .n { color: var(--pos); }
    .kpi.neu .n { color: var(--neu); }
    .kpi.neg .n { color: var(--neg); }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: start;
    }
    .emotion-cards {
      display: grid;
      gap: 10px;
    }
    .emotion-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fbfefe;
    }
    .emotion-card h3 {
      margin: 0 0 6px;
      font-size: 0.98rem;
    }
    .emotion-card p {
      margin: 0 0 6px;
      font-size: 0.86rem;
    }
    .emotion-list {
      margin: 0;
      padding-left: 18px;
      line-height: 1.35;
      font-size: 0.9rem;
      color: var(--ink);
    }
    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }
    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.86rem;
      color: var(--muted);
      margin-top: 8px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 6px;
      vertical-align: -1px;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    .table th, .table td {
      border-bottom: 1px solid #e2ecea;
      padding: 8px 6px;
      text-align: left;
      white-space: normal;
      word-break: normal;
      overflow-wrap: normal;
    }
    .table th { color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.3px; }
    .note {
      font-size: 0.86rem;
      color: var(--muted);
      line-height: 1.45;
    }
    @media (max-width: 980px) {
      .kpi-grid { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
